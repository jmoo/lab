name: Deploy jmoo.io

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/pages.yml
      - sites/jmoo.io/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      id-token: write
      pages: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: sites/jmoo.io
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
