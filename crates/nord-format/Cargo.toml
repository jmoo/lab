[package]
name = "nord-format"
description = "Parse and write Clavia / Nord keyboard binary file formats (Electro 5, …)"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "nord_format"

[features]
default = []
# ZIP-based backup bundles pull in the `zip` stack; opt in with `--features
# bundle`. Off by default so parse-only consumers (and the corpus round-trip
# tests, which never touch bundles) stay lean.
bundle = ["dep:zip"]
# The corpus-backed round-trip/decode tests (tests/corpus_cases.rs, ne5.rs) need
# the specimen corpus (NORD_CORPUS_DIR). Off by default so the open minimal suite
# runs anywhere; the Nix `nord-format-corpus` check enables it. Test-only.
corpus = []

[dependencies]
binrw = "0.14"
nord-bits-derive = { path = "../nord-bits-derive" }
crcxx = "0.3.1"
thiserror = "2"
zip = { version = "2", optional = true, default-features = false, features = [
  "deflate",
] }

[dev-dependencies]
libtest-mimic = "0.8"
# The corpus ships an oracle sidecar per specimen; the decode sweep reads them,
# and the container sweep's pool floors read the corpus's own `library.json`.
serde_json = "1"

# One reported case per specimen instead of one per sweep, so a failure names the
# file and the first one does not hide the rest. Needs its own `main`, hence
# `harness = false`; without `--features corpus` that `main` does nothing.
[[test]]
name = "corpus_cases"
harness = false

# The multi-model container sweep, same harness and for the same reason: ten thousand
# specimens across 32 models, each of which has to name itself when it moves.
[[test]]
name = "containers"
harness = false
