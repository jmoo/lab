[package]
name = "nord-gui"
description = "egui front-end over nord-format / nord-usb — the same UI native and in the browser"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "nord-gui"
path = "src/main.rs"

[dependencies]
egui = "0.35"
nord-format = { path = "../nord-format" }

# `glow` is the only renderer that works on both desktop and WebGL, and the default
# feature set drags in accesskit + the screen reader for no gain in a demo.
eframe = { version = "0.35", default-features = false, features = [
  "default_fonts",
  "glow",
  "wayland",
  "x11",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# `nusb` for real hardware, `replay` so the recorded exchange demo runs here too, and
# `blocking` because egui's update loop is synchronous.
nord-usb = { path = "../nord-usb", features = ["blocking", "nusb", "replay"] }
rfd = "0.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
# No `nusb` in a browser: WebUSB would be the backend, and nord-usb has no web
# transport yet, so the wasm build talks to the replayed capture only.
nord-usb = { path = "../nord-usb", default-features = false, features = ["replay"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Window"] }
