[package]
name = "anki-mcp"
description = "Read-only MCP adapter for anki-tool"
edition.workspace = true
license.workspace = true
publish = false
version.workspace = true

[dependencies]
rmcp = { version = "3.8", default-features = false, features = [
  "server",
  "transport-io",
] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }

[dev-dependencies]
rmcp = { version = "3.8", default-features = false, features = ["client"] }
